name: Deploy to Server (SSH)

# Deploys the static site onto a self-managed Linux server over SSH.
# Credentials are read from repository secrets:
#   SERVER_HOST, SERVER_USER, SERVER_PORT, SERVER_PASSWORD
on:
  workflow_dispatch:
    inputs:
      port:
        description: "Port for the site to listen on"
        required: false
        default: "8090"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 10m
          script: |
            set -e
            export PATH="$PATH:/usr/local/bin:/usr/bin"
            if ! command -v node >/dev/null 2>&1; then
              echo "Installing Node.js 20..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi
            echo "node $(node -v)"
            if [ -d "$HOME/CJY-Codex/.git" ]; then
              git -C "$HOME/CJY-Codex" pull --ff-only
            else
              git clone https://github.com/1739467001-svg/CJY-Codex.git "$HOME/CJY-Codex"
            fi
            cd "$HOME/CJY-Codex"
            bash scripts/deploy-server.sh "${{ github.event.inputs.port }}"
            sleep 2
            PORT="$(cat "$HOME/CJY-Codex/.serverport")"
            echo "Health check on 127.0.0.1:$PORT"
            curl -fsS -o /dev/null -w "HTTP %{http_code}\n" "http://127.0.0.1:$PORT/"
            echo "----- last log lines -----"
            tail -n 8 "$HOME/CJY-Codex/site.log" || true
